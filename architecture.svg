<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500">
  <defs>
    <marker id="ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#4b5563"/>
    </marker>
    <marker id="ah-rev" viewBox="0 0 10 8" refX="1" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M10,0 L0,4 L10,8 Z" fill="#4b5563"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- ═════ OPERATOR TENANT outer box ═════ -->
  <rect x="10" y="10" width="840" height="322" rx="12"
        fill="#111827" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="20" y="30" font-size="11" fill="#3b82f6" font-weight="600" letter-spacing="0.8">
    Operator Tenant — your Azure subscription
  </text>

  <!-- ── Container App card ── -->
  <rect x="22" y="42" width="220" height="128" rx="9"
        fill="#1e293b" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="32" y="54" width="26" height="18" rx="4" fill="#2563eb"/>
  <text x="45" y="67" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">ACA</text>
  <text x="64" y="67" font-size="9.5" fill="#93c5fd">Azure Container App</text>
  <text x="32" y="96" font-size="13" font-weight="700" fill="#f1f5f9">Lab Tenant Manager</text>
  <text x="32" y="115" font-size="9.5" fill="#64748b">ghcr.io/holgerimbery/</text>
  <text x="32" y="130" font-size="9.5" fill="#64748b">lab-tenant-manager:latest</text>
  <text x="32" y="159" font-size="9" fill="#475569">Next.js 14 · Node 20 · Managed Identity</text>

  <!-- ── App Registration card ── -->
  <rect x="556" y="42" width="278" height="226" rx="9"
        fill="#1e293b" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="566" y="54" width="26" height="18" rx="4" fill="#7c3aed"/>
  <text x="579" y="67" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">AR</text>
  <text x="600" y="67" font-size="9.5" fill="#c4b5fd">Entra ID — Multi-tenant</text>
  <text x="566" y="96" font-size="13" font-weight="700" fill="#f1f5f9">App Registration</text>
  <text x="575" y="121" font-size="10" fill="#94a3b8">●  OIDC login for SaaS admins</text>
  <text x="575" y="143" font-size="10" fill="#94a3b8">●  Mail.Send (Application permission)</text>
  <text x="575" y="165" font-size="10" fill="#94a3b8">●  Microsoft Graph API permissions</text>
  <text x="575" y="187" font-size="10" fill="#94a3b8">●  Power Platform BAP API permissions</text>
  <text x="575" y="209" font-size="10" fill="#94a3b8">●  Multi-tenant admin consent flow</text>
  <text x="566" y="250" font-size="9" fill="#4b5563">Lab tenant Global Admin consents once via URL</text>

  <!-- ── Cosmos DB card ── -->
  <rect x="22" y="196" width="196" height="106" rx="9"
        fill="#1e293b" stroke="#0891b2" stroke-width="1.5"/>
  <rect x="32" y="208" width="26" height="18" rx="4" fill="#0891b2"/>
  <text x="45" y="221" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">CDB</text>
  <text x="64" y="221" font-size="9.5" fill="#67e8f9">Azure Cosmos DB</text>
  <text x="32" y="252" font-size="12" font-weight="700" fill="#f1f5f9">Document Store</text>
  <text x="32" y="271" font-size="9.5" fill="#64748b">tenants · codes · lab users</text>
  <text x="32" y="288" font-size="9.5" fill="#64748b">audit logs per tenant</text>

  <!-- ── Key Vault card ── -->
  <rect x="232" y="196" width="196" height="106" rx="9"
        fill="#1e293b" stroke="#0891b2" stroke-width="1.5"/>
  <rect x="242" y="208" width="26" height="18" rx="4" fill="#0891b2"/>
  <text x="255" y="221" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">KV</text>
  <text x="274" y="221" font-size="9.5" fill="#67e8f9">Azure Key Vault</text>
  <text x="242" y="252" font-size="12" font-weight="700" fill="#f1f5f9">Secret Store</text>
  <text x="242" y="271" font-size="9.5" fill="#64748b">encrypted refresh tokens</text>
  <text x="242" y="288" font-size="9.5" fill="#64748b">one secret per lab tenant</text>

  <!-- ══ Internal connections ══ -->

  <!-- Container App ↔ App Registration (dashed bidirectional) -->
  <line x1="242" y1="105" x2="556" y2="105"
        stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3"
        marker-start="url(#ah-rev)" marker-end="url(#ah)"/>
  <rect x="364" y="95" width="132" height="17" rx="4" fill="#111827"/>
  <text x="430" y="107" text-anchor="middle" font-size="9" fill="#6b7280">OIDC · Graph · BAP</text>

  <!-- Container App → Cosmos DB (vertical) -->
  <line x1="120" y1="170" x2="120" y2="196"
        stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Container App → Key Vault (routed) -->
  <path d="M 180,170 L 180,184 L 330,184 L 330,196"
        stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <!-- ══ API Bridge ══ -->
  <line x1="430" y1="332" x2="430" y2="368"
        stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="430" y="349" text-anchor="middle" font-size="9.5" fill="#6b7280">MS Graph API (application permissions)</text>
  <text x="430" y="366" text-anchor="middle" font-size="9.5" fill="#6b7280">Power Platform BAP API (delegated refresh token)</text>

  <!-- ═════ LAB TENANT outer box ═════ -->
  <rect x="10" y="374" width="840" height="114" rx="12"
        fill="#111827" stroke="#065f46" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="20" y="394" font-size="11" fill="#34d399" font-weight="600" letter-spacing="0.6">
    Lab Tenant — standard Microsoft 365 tenant (one per client)
  </text>
  <text x="32" y="420" font-size="10.5" fill="#94a3b8">●  Per-user Power Platform Developer environment with Dataverse — routed to Maker Welcome</text>
  <text x="32" y="444" font-size="10.5" fill="#94a3b8">●  Security group membership → license assignment per workshop participant</text>
  <text x="32" y="468" font-size="10.5" fill="#94a3b8">●  Cleanup removes all labadmin* users &amp; environments to reset between workshops</text>
</svg>
